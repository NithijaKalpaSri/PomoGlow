[package]
name = "pomoglow-setup"
version = "0.2.0"
edition = "2021"

[dependencies]
miniz_oxide = "0.8"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
